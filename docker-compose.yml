services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWOPS_DB_NAME:-flowops}
      POSTGRES_USER: ${FLOWOPS_DB_USER:-flowops}
      POSTGRES_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Set FLOWOPS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FLOWOPS_DB_PORT:-5432}:5432"
    volumes:
      - flowops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowops-postgres-data:
